# O Keycloak não vive mais aqui: ele é compartilhado entre projetos e mora em ../sso
# (realm "studies", porta 8082). Suba-o primeiro (`cd ../sso && docker compose up -d`);
# a rede externa shared-sso é o que permite às APIs alcançá-lo por http://keycloak:8080.
services:
  product-api:
    build:
      context: .
      dockerfile: src/Product/KShop.ProductApi/Dockerfile
    ports:
      - "5289:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/product.db
      - Keycloak__Authority=http://keycloak:8080/realms/studies
      - Keycloak__Issuer=http://localhost:8082/realms/studies
      - Keycloak__Audience=kshop-api
      - Frontend__Origin=http://localhost:5174
      - UserApi__GrpcAddress=http://users-api:8081
    volumes:
      - product-api-data:/data
    networks:
      - default
      - shared-sso
    depends_on:
      users-api:
        condition: service_started

  users-api:
    build:
      context: .
      dockerfile: src/User/KShop.UserApi/Dockerfile
    ports:
      - "5291:8080"
      - "5292:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/user.db
      - Keycloak__Authority=http://keycloak:8080/realms/studies
      - Keycloak__Issuer=http://localhost:8082/realms/studies
      - Keycloak__Audience=kshop-api
      - Frontend__Origin=http://localhost:5174
    volumes:
      - users-api-data:/data
    networks:
      - default
      - shared-sso

  # order-api:
  #   build:
  #     context: ./src/Order
  #     dockerfile: KShop.OrderApi/Dockerfile
  #   ports:
  #     - "5290:8080"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:5174"
    environment:
      - VITE_PRODUCT_API_URL=http://localhost:5289
      - VITE_USER_API_URL=http://localhost:5291
      - VITE_KEYCLOAK_URL=http://localhost:8082
      - VITE_KEYCLOAK_REALM=studies
      - VITE_KEYCLOAK_CLIENT_ID=kshop-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - product-api

volumes:
  product-api-data:
  users-api-data:

networks:
  shared-sso:
    external: true
