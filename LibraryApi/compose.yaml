version: "3.9"

services:
  libraryapi:
    image: libraryapi
    build:
      context: .
      dockerfile: LibraryApi/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=LibraryApi;Username=postgres;Password=postgres

    ports:
      - "8080:8080"

  postgres:
    image: postgres:17
    container_name: postgres-library

    restart: unless-stopped

    environment:
      - POSTGRES_DB=LibraryApi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LibraryApi"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin

    restart: unless-stopped

    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json

    ports:
      - "5050:80"

    depends_on:
      - postgres

    user: root

    entrypoint: >
      /bin/sh -c "cp /pgadmin4/pgpass /pgpass &&
      chmod 600 /pgpass &&
      chown pgadmin:root /pgpass &&
      /entrypoint.sh"

    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro

volumes:
  postgres-data:
  pgadmin-data: